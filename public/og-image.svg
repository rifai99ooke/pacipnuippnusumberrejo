<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Pattern dots -->
  <circle cx="50" cy="50" r="3" fill="white" opacity="0.1"/>
  <circle cx="150" cy="80" r="2" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="100" r="4" fill="white" opacity="0.1"/>
  <circle cx="1050" cy="500" r="3" fill="white" opacity="0.1"/>
  <circle cx="100" cy="550" r="2" fill="white" opacity="0.1"/>

  <!-- White card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="white" opacity="0.08"/>

