  <circle cx="600" cy="210" r="80" fill="white" opacity="0.15"/>
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">NU</text>

  <!-- Title -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" text-anchor="middle">PAC IPNU IPPNU</text>
  <text x="600" y="405" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">Sumberrejo</text>

